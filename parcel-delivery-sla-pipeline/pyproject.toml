[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parcel-delivery-sla-pipeline"
version = "1.0.0"
description = "Reproducible parcel event ingestion and operational SLA reporting"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Project contributors"}]
dependencies = []

[project.scripts]
parcel-sla = "parcel_sla.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
